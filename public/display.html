<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Photobox Server - Display Antrian</title>
    <meta name="description" content="Display monitor untuk antrian photobox">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink: #FF6B9D;
            --blue: #4ECDC4;
            --yellow: #FFE66D;
            --purple: #A855F7;
            --orange: #FF8C42;
            --green: #06D6A0;
            --dark: #2D3436;
            --light: #FFF9F0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            background: var(--light);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 107, 157, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 230, 109, 0.1) 0%, transparent 50%);
            background-size: 200% 200%;
            animation: bgShift 15s ease infinite;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 249, 240, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }

        .start-card {
            background: white;
            border-radius: 40px;
            padding: 60px 80px;
            text-align: center;
            border: 6px solid var(--pink);
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .start-card h1 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--pink);
            margin-bottom: 12px;
        }

        .start-card p {
            font-size: 1.2rem;
            font-weight: 500;
            color: #aaa;
        }

        .display-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .location-badge {
            display: inline-block;
            padding: 16px 50px;
            border-radius: 60px;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            letter-spacing: 3px;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .location-badge.studio {
            background: linear-gradient(135deg, var(--pink), var(--orange));
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
        }

        .location-badge.youth {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .calling-label {
            display: inline-block;
            padding: 10px 36px;
            border-radius: 30px;
            background: white;
            border: 4px solid var(--blue);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--blue);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.2);
        }

        .main-number-card {
            background: white;
            border-radius: 50px;
            padding: 40px 100px;
            border: 6px solid var(--purple);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.15);
            text-align: center;
            transition: all 0.3s;
        }

        .main-number {
            font-size: 12rem;
            font-weight: 700;
            color: var(--dark);
            text-shadow: 6px 6px 0px var(--yellow);
            line-height: 1;
        }

        .main-name {
            font-size: 2rem;
            font-weight: 500;
            color: #aaa;
            margin-top: 8px;
        }

        .blinking {
            animation: blinker 1s linear 5;
        }

        @keyframes blinker {
            50% { opacity: 0.3; }
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .waiting-card {
            background: white;
            border-radius: 30px;
            padding: 24px 60px;
            border: 4px solid var(--green);
            box-shadow: 0 8px 25px rgba(6, 214, 160, 0.15);
            text-align: center;
            min-width: 400px;
        }

        .waiting-label {
            font-size: 1.5rem;
            font-weight: 600;
            color: #bbb;
            margin-bottom: 4px;
        }

        .waiting-number {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--green);
        }

        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 3px solid #E0E0E0;
            border-radius: 14px;
            padding: 10px 18px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 50;
        }

        .fullscreen-btn:hover {
            border-color: var(--purple);
            color: var(--purple);
        }

        .float-deco {
            position: fixed;
            font-size: 3rem;
            opacity: 0.15;
            animation: floatDeco 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .float-deco:nth-child(1) { top: 5%; left: 3%; animation-delay: 0s; }
        .float-deco:nth-child(2) { top: 8%; right: 5%; animation-delay: 1.5s; }
        .float-deco:nth-child(3) { bottom: 8%; left: 5%; animation-delay: 3s; }
        .float-deco:nth-child(4) { bottom: 5%; right: 3%; animation-delay: 4.5s; }

        @keyframes floatDeco {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            75% { transform: translateY(15px) rotate(-5deg); }
        }
    </style>
</head>
<body>
    <!-- Floating decorations -->
    <div class="float-deco">📸</div>
    <div class="float-deco">🌟</div>
    <div class="float-deco">🎉</div>
    <div class="float-deco">💖</div>

    <!-- START OVERLAY -->
    <div id="start-overlay" class="start-overlay" onclick="initDisplay()">
        <div class="start-card">
            <h1>🎉 TAP UNTUK MULAI</h1>
            <p>(Membuka akses suara)</p>
        </div>
    </div>

    <!-- MAIN DISPLAY -->
    <div class="display-container">
        <div class="top-bar">
            <div class="location-badge" id="location-badge">STUDIO UTAMA</div>
        </div>

        <div class="center-area">
            <div class="calling-label">✨ SEDANG DIPANGGIL ✨</div>
            <div class="main-number-card">
                <div class="main-number" id="now-serving">-</div>
                <div class="main-name" id="now-serving-name"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="waiting-card">
                <div class="waiting-label">📋 MENUNGGU GILIRAN</div>
                <div class="waiting-number" id="waiting-count">0 Orang</div>
            </div>
        </div>
    </div>

    <!-- Fullscreen button -->
    <button class="fullscreen-btn" onclick="document.documentElement.requestFullscreen().catch(console.log)">
        🖥️ Layar Penuh
    </button>

    <!-- Audio elements (reused for iOS Safari compatibility) -->
    <audio id="bell-sound" src="/bell.mp3" preload="auto"></audio>
    <audio id="tts-sound" preload="auto"></audio>

    <script>
        const socket = io();
        const loc = window.location.pathname.includes('outdoor') ? 'Youth Center' : 'Studio Utama';

        const badge = document.getElementById('location-badge');
        badge.textContent = loc.toUpperCase();
        badge.classList.add(loc === 'Youth Center' ? 'youth' : 'studio');

        socket.emit('join_location', loc);

        socket.on('update_stats', (stats) => {
            const numEl = document.getElementById('now-serving');
            const nameEl = document.getElementById('now-serving-name');

            if (stats.nowServing) {
                if (numEl.textContent !== stats.nowServing.queue_number) {
                    numEl.textContent = stats.nowServing.queue_number;
                    nameEl.textContent = `${stats.nowServing.name} (${stats.nowServing.sessions} Sesi)`;
                    numEl.classList.add('blinking');
                    setTimeout(() => numEl.classList.remove('blinking'), 5000);
                }
            } else {
                numEl.textContent = '00';
                nameEl.textContent = 'Belum ada antrian';
            }

            document.getElementById('waiting-count').textContent = stats.waiting + ' Orang';
        });

        // iOS Safari compatible audio system
        let audioCtx = null;
        let bellBuffer = null;
        let audioUnlocked = false;
        const bellEl = document.getElementById('bell-sound');
        const ttsEl = document.getElementById('tts-sound');

        function initDisplay() {
            document.getElementById('start-overlay').remove();
            audioUnlocked = true;

            // Create AudioContext on user gesture (REQUIRED for iOS Safari)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // iOS Safari: resume the context immediately on user tap
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Preload bell into Web Audio API buffer
            fetch('/bell.mp3')
                .then(r => r.arrayBuffer())
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(decoded => { bellBuffer = decoded; })
                .catch(e => console.warn('Bell decode error:', e));

            // Unlock HTML audio elements by playing muted (iOS requires this)
            bellEl.muted = true;
            bellEl.play().then(() => {
                bellEl.pause();
                bellEl.currentTime = 0;
                bellEl.muted = false;
            }).catch(() => {});

            ttsEl.muted = true;
            ttsEl.src = '/bell.mp3';
            ttsEl.play().then(() => {
                ttsEl.pause();
                ttsEl.currentTime = 0;
                ttsEl.muted = false;
                ttsEl.src = '';
            }).catch(() => {});
        }

        async function playBellSound() {
            // Try Web Audio API first (most reliable on iOS)
            if (audioCtx && bellBuffer) {
                try {
                    if (audioCtx.state === 'suspended') await audioCtx.resume();
                    const source = audioCtx.createBufferSource();
                    source.buffer = bellBuffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                    return new Promise(resolve => {
                        source.onended = resolve;
                        setTimeout(resolve, 3000);
                    });
                } catch (e) {
                    console.warn('Web Audio bell failed:', e);
                }
            }
            // Fallback: HTML audio element
            try {
                bellEl.currentTime = 0;
                await bellEl.play();
                return new Promise(resolve => {
                    bellEl.onended = resolve;
                    setTimeout(resolve, 3000);
                });
            } catch (e) {
                console.warn('HTML bell fallback failed:', e);
            }
        }

        async function playChimeAndSpeak(number, name) {
            if (!audioUnlocked) return;

            try {
                // Resume audio context if suspended
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // Play bell
                await playBellSound();

                // Small pause after bell
                await new Promise(r => setTimeout(r, 500));

                // TTS
                const text = `Nomor antrian ${number} atas nama ${name}, segera ke photobox sekarang`;
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Use existing HTML audio element (iOS Safari compatible)
                ttsEl.src = audioUrl;
                ttsEl.load();
                await ttsEl.play();

                ttsEl.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                };
            } catch (e) {
                console.error("Audio/TTS Error:", e);
            }
        }

        socket.on('play_audio', (queue) => {
            playChimeAndSpeak(queue.queue_number, queue.name);
        });
    </script>
</body>
</html>
