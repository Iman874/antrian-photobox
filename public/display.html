<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monobox Server - Display Antrian</title>
    <meta name="description" content="Display monitor untuk antrian Monobox">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF9D9D;
            --blush: #FFC5AA;
            --yellow: #EEF8CD;
            --purple: #E8767F;
            --orange: #BBF1D2;
            --green: #06D6A0;
            --dark: #452030;
            --light: #FFF9F0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            background: var(--light);
            background-image: url('/bgdesktop.webp');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 249, 240, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }

        .start-card {
            background: #D62839;
            border-radius: 40px;
            padding: 60px 80px;
            text-align: center;
            border: 6px solid #D62839;
            box-shadow: 0 20px 60px rgba(214, 40, 57, 0.35);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        .start-card h1 {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 12px;
        }

        .start-card p {
            font-size: 1.2rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        .display-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 40px;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .top-bar .logo-img {
            display: block;
            width: auto;
            height: 56px;
        }

        .location-badge {
            display: inline-block;
            padding: 16px 50px;
            border-radius: 60px;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 3px;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .location-badge.studio {
            background: linear-gradient(135deg, #D62839, #D81B60);
            box-shadow: 0 10px 30px rgba(214, 40, 57, 0.4);
            color: white;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        }

        .location-badge.youth {
            background: linear-gradient(135deg, #00796B, #D62839);
            box-shadow: 0 10px 30px rgba(0, 121, 107, 0.4);
            color: white;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .calling-label {
            display: inline-block;
            padding: 10px 36px;
            border-radius: 30px;
            background: #D62839;
            border: 4px solid #D62839;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            box-shadow: 0 4px 15px rgba(214, 40, 57, 0.35);
        }

        .main-number-card {
            background: #D62839;
            border-radius: 50px;
            padding: 40px 100px;
            border: 6px solid #D62839;
            box-shadow: 0 15px 40px rgba(214, 40, 57, 0.35);
            text-align: center;
            transition: all 0.3s;
        }

        .main-number {
            font-size: 12rem;
            font-weight: 700;
            color: white;
            text-shadow: 6px 6px 0 rgba(0, 0, 0, 0.22);
            line-height: 1;
        }

        .main-name {
            font-size: 2rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
            margin-top: 8px;
        }

        .blinking {
            animation: blinker 1s linear 5;
        }

        @keyframes blinker {
            50% {
                opacity: 0.3;
            }
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .waiting-card {
            background: #00796B;
            border-radius: 30px;
            padding: 24px 60px;
            border: 4px solid #00796B;
            box-shadow: 0 8px 25px rgba(0, 121, 107, 0.35);
            text-align: center;
            min-width: 400px;
        }

        .waiting-label {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 4px;
        }

        .waiting-number {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
        }

        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 3px solid #E0E0E0;
            border-radius: 14px;
            padding: 10px 18px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #452030;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 50;
        }

        .fullscreen-btn:hover {
            border-color: #D62839;
            color: #D62839;
        }
    </style>
</head>

<body>
    <!-- START OVERLAY -->
    <div id="start-overlay" class="start-overlay" onclick="initDisplay()">
        <div class="start-card">
            <h1>TAP UNTUK MULAI</h1>
            <p>(Membuka akses suara)</p>
        </div>
    </div>

    <!-- MAIN DISPLAY -->
    <div class="display-container">
        <div class="top-bar">
            <img src="/logobarumonobox-crop.png" alt="Monobox" class="logo-img">
            <div class="location-badge" id="location-badge">STUDIO UTAMA</div>
        </div>

        <div class="center-area">
            <div class="calling-label">SEDANG DIPANGGIL</div>
            <div class="main-number-card">
                <div class="main-number" id="now-serving">-</div>
                <div class="main-name" id="now-serving-name"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="waiting-card">
                <div class="waiting-label">MENUNGGU GILIRAN</div>
                <div class="waiting-number" id="waiting-count">0 Orang</div>
            </div>
        </div>
    </div>

    <!-- Fullscreen button -->
    <button class="fullscreen-btn" onclick="document.documentElement.requestFullscreen().catch(console.log)">
        Layar Penuh
    </button>

    <!-- Audio elements (reused for iOS Safari compatibility) -->
    <audio id="bell-sound" src="/bell.mp3" preload="auto"></audio>
    <audio id="tts-sound" preload="auto"></audio>

    <script>
        const loc = window.location.pathname.includes('outdoor') ? 'Youth Center' : 'Studio Utama';
        const locLabel = loc === 'Youth Center' ? 'JAMSIT' : 'Studio Utama';
        const evtSource = new EventSource('/api/stream/' + loc);

        const badge = document.getElementById('location-badge');
        badge.textContent = locLabel.toUpperCase();
        badge.classList.add(loc === 'Youth Center' ? 'youth' : 'studio');

        function updateStats(stats) {
            const numEl = document.getElementById('now-serving');
            const nameEl = document.getElementById('now-serving-name');

            if (stats.nowServing) {
                if (numEl.textContent !== stats.nowServing.queue_number) {
                    numEl.textContent = stats.nowServing.queue_number;
                    nameEl.textContent = `${stats.nowServing.name} (${stats.nowServing.sessions} Sesi)`;
                    numEl.classList.add('blinking');
                    setTimeout(() => numEl.classList.remove('blinking'), 5000);
                }
            } else {
                numEl.textContent = '00';
                nameEl.textContent = 'Belum ada antrian';
            }

            document.getElementById('waiting-count').textContent = stats.waiting + ' Orang';
        }

        // SSE: Jalur utama
        evtSource.addEventListener('update_stats', (e) => {
            updateStats(JSON.parse(e.data));
        });

        // FALLBACK POLLING: Cadangan update (SSE = jalur utama realtime)
        setInterval(async () => {
            try {
                const res = await fetch('/api/stats/' + encodeURIComponent(loc));
                const stats = await res.json();
                updateStats(stats);
            } catch (e) { /* abaikan */ }
        }, 5000);

        // iOS Safari compatible audio system
        let audioCtx = null;
        let bellBuffer = null;
        let audioUnlocked = false;
        const bellEl = document.getElementById('bell-sound');
        const ttsEl = document.getElementById('tts-sound');

        function initDisplay() {
            document.getElementById('start-overlay').remove();
            audioUnlocked = true;

            // Create AudioContext on user gesture (REQUIRED for iOS Safari)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // iOS Safari: resume the context immediately on user tap
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Preload bell into Web Audio API buffer
            fetch('/bell.mp3')
                .then(r => r.arrayBuffer())
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(decoded => { bellBuffer = decoded; })
                .catch(e => console.warn('Bell decode error:', e));

            // Unlock HTML audio elements by playing muted (iOS requires this)
            bellEl.muted = true;
            bellEl.play().then(() => {
                bellEl.pause();
                bellEl.currentTime = 0;
                bellEl.muted = false;
            }).catch(() => { });

            ttsEl.muted = true;
            ttsEl.src = '/bell.mp3';
            ttsEl.play().then(() => {
                ttsEl.pause();
                ttsEl.currentTime = 0;
                ttsEl.muted = false;
                ttsEl.src = '';
            }).catch(() => { });
        }

        async function playBellSound() {
            // Try Web Audio API first (most reliable on iOS)
            if (audioCtx && bellBuffer) {
                try {
                    if (audioCtx.state === 'suspended') await audioCtx.resume();
                    const source = audioCtx.createBufferSource();
                    source.buffer = bellBuffer;
                    source.connect(audioCtx.destination);
                    source.start(0);
                    return new Promise(resolve => {
                        source.onended = resolve;
                        setTimeout(resolve, 3000);
                    });
                } catch (e) {
                    console.warn('Web Audio bell failed:', e);
                }
            }
            // Fallback: HTML audio element
            try {
                bellEl.currentTime = 0;
                await bellEl.play();
                return new Promise(resolve => {
                    bellEl.onended = resolve;
                    setTimeout(resolve, 3000);
                });
            } catch (e) {
                console.warn('HTML bell fallback failed:', e);
            }
        }

        function toTitleCase(str) {
            if (!str) return '';
            return str.toLowerCase().split(/\s+/).map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        async function playChimeAndSpeak(number, name) {
            if (!audioUnlocked) return;

            try {
                // Resume audio context if suspended
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                // Play bell
                await playBellSound();

                // Small pause after bell
                await new Promise(r => setTimeout(r, 500));

                // TTS - Convert name to Title Case for proper pronunciation
                const text = `Nomor antrian ${number} atas nama ${toTitleCase(name)}, segera ke Monobox sekarang`;
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Use existing HTML audio element (iOS Safari compatible)
                ttsEl.src = audioUrl;
                ttsEl.load();
                await ttsEl.play();

                ttsEl.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                };
            } catch (e) {
                console.error("Audio/TTS Error:", e);
            }
        }

        evtSource.addEventListener('play_audio', (e) => {
            const queue = JSON.parse(e.data);
            playChimeAndSpeak(queue.queue_number, queue.name);
        });
    </script>
</body>

</html>
