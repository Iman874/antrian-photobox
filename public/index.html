<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monobox Queue - Pilih Lokasi</title>
    <meta name="description" content="Pilih lokasi dan ambil nomor antrian untuk foto Monobox.">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF9D9D;
            --blush: #FFC5AA;
            --yellow: #EEF8CD;
            --purple: #D62839;
            --orange: #BBF1D2;
            --green: #06D6A0;
            --dark: #452030;
            --light: #FFF9F0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            background: var(--light);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 157, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 197, 170, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(238, 248, 205, 0.2) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* Header */
        .header {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-badge {
            display: inline-block;
            padding: 16px 40px;
        }

        .logo-badge img {
            display: block;
            width: auto;
            height: 72px;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .subtitle {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--purple);
            background: rgba(214, 40, 57, 0.1);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Section label */
        .section-label {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: var(--dark);
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(214, 40, 57, 0.3);
            animation: fadeInUp 0.6s ease 0.5s both;
        }

        /* Location cards */
        .cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            animation: fadeInUp 0.6s ease 0.6s both;
            position: relative;
            z-index: 1;
        }

        .location-card {
            background: white;
            border-radius: 24px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 4px solid transparent;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .location-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            border-radius: 24px 24px 0 0;
        }

        .card-studio::before {
            background: linear-gradient(90deg, var(--pink), var(--orange));
        }

        .card-youth::before {
            background: linear-gradient(90deg, var(--blush), var(--purple));
        }

        .card-studio {
            border-color: rgba(255, 157, 157, 0.3);
        }

        .card-youth {
            border-color: rgba(255, 197, 170, 0.3);
        }

        .location-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .card-studio:hover {
            border-color: var(--pink);
            background: #FFF5F7;
        }

        .card-youth:hover {
            border-color: var(--pink);
            background: #FFF5EC;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-studio .card-title {
            color: var(--pink);
        }

        .card-youth .card-title {
            color: var(--purple);
        }

        .card-subtitle {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .card-studio .card-subtitle {
            background: rgba(255, 157, 157, 0.1);
            color: var(--pink);
        }

        .card-youth .card-subtitle {
            background: rgba(255, 197, 170, 0.15);
            color: var(--purple);
        }

        .card-stats {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            padding-top: 12px;
            border-top: 2px dashed #F0F0F0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #452030;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: #452030;
            animation: fadeInUp 0.6s ease 0.8s both;
            position: relative;
            z-index: 1;
        }

        .footer span {
            color: var(--pink);
        }

        /* Social links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease 0.7s both;
            position: relative;
            z-index: 1;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            background: white;
            border: 2px solid #F3DEDE;
            border-radius: 20px;
            padding: 8px 14px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: var(--purple);
            border-color: rgba(214, 40, 57, 0.4);
            transform: translateY(-2px);
        }

        .social-links svg {
            width: 16px;
            height: 16px;
        }

        /* Mobile responsiveness */
        @media (max-width: 400px) {
            .logo-badge {
                font-size: 1.6rem;
                padding: 12px 28px;
            }

            .card-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-badge"><img src="/logobarumonobox-crop.png" alt="Monobox"></div>
            <div class="subtitle">Pilih lokasi, ambil nomor antrianmu</div>
        </div>

        <!-- Section Label -->
        <div class="section-label">PILIH LOKASI</div>

        <!-- Location Cards -->
        <div class="cards-wrapper">
            <!-- Studio Utama -->
            <a href="/indoor/queue" class="location-card card-studio" id="card-studio">
                <div class="card-title">STUDIO UTAMA</div>
                <div class="card-subtitle">Indoor Studio</div>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">Menunggu</span>
                        <span class="stat-value" id="studio-waiting">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Est. Waktu</span>
                        <span class="stat-value" id="studio-est">~0m</span>
                    </div>
                </div>
            </a>

            <!-- Youth Center -->
            <a href="/outdoor/queue" class="location-card card-youth" id="card-youth">
                <div class="card-title">JAMSIT</div>
                <div class="card-subtitle">Outdoor Studio</div>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">Menunggu</span>
                        <span class="stat-value" id="youth-waiting">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Est. Waktu</span>
                        <span class="stat-value" id="youth-est">~0m</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- Social Media -->
        <div class="social-links">
            <a href="https://monobox.monoframe.id/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <span>Website</span>
            </a>
            <a href="https://www.instagram.com/monobox.frame/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span>Instagram</span>
            </a>
            <a href="https://www.tiktok.com/@monobox.frame" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                <span>TikTok</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            MONODEV <span id="year">2026</span>
        </div>
    </div>

    <script>
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        const evtSource = new EventSource('/api/stream/All');

        function updateAllStats(data) {
            const studio = data['Studio Utama'];
            const youth = data['Youth Center'];

            document.getElementById('studio-waiting').textContent = studio.waiting;
            document.getElementById('studio-est').textContent = `~${studio.waiting * studio.session_duration}m`;

            document.getElementById('youth-waiting').textContent = youth.waiting;
            document.getElementById('youth-est').textContent = `~${youth.waiting * youth.session_duration}m`;
        }

        // SSE: Jalur utama
        evtSource.addEventListener('update_all_stats', (e) => {
            updateAllStats(JSON.parse(e.data));
        });

        // FALLBACK POLLING: Paksa update setiap 500ms
        setInterval(async () => {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                updateAllStats(data);
            } catch (e) { /* abaikan */ }
        }, 500);
    </script>
</body>

</html>
