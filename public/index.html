<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Monobox Queue - Pilih Lokasi</title>
    <meta name="description" content="Sistem antrian Monobox yang seru dan menyenangkan!">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF6B9D;
            --blue: #4ECDC4;
            --yellow: #FFE66D;
            --purple: #A855F7;
            --orange: #FF8C42;
            --green: #06D6A0;
            --dark: #2D3436;
            --light: #FFF9F0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            background: var(--light);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 230, 109, 0.2) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* Floating decorations */
        .floating-emoji {
            position: fixed;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .floating-emoji:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-emoji:nth-child(2) {
            top: 20%;
            right: 8%;
            animation-delay: 1s;
        }

        .floating-emoji:nth-child(3) {
            bottom: 15%;
            left: 10%;
            animation-delay: 2s;
        }

        .floating-emoji:nth-child(4) {
            bottom: 25%;
            right: 5%;
            animation-delay: 3s;
        }

        .floating-emoji:nth-child(5) {
            top: 50%;
            left: 2%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-15px) rotate(5deg);
            }

            75% {
                transform: translateY(10px) rotate(-5deg);
            }
        }

        /* Header */
        .header {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        .logo-badge::after {
            content: '✨';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 1.5rem;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }

            50% {
                transform: scale(1.3) rotate(15deg);
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .subtitle {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--purple);
            background: rgba(168, 85, 247, 0.1);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Section label */
        .section-label {
            background: linear-gradient(135deg, var(--green), var(--blue));
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(6, 214, 160, 0.3);
            animation: fadeInUp 0.6s ease 0.5s both;
        }

        /* Location cards */
        .cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            animation: fadeInUp 0.6s ease 0.6s both;
            position: relative;
            z-index: 1;
        }

        .location-card {
            background: white;
            border-radius: 24px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 4px solid transparent;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .location-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            border-radius: 24px 24px 0 0;
        }

        .card-studio::before {
            background: linear-gradient(90deg, var(--pink), var(--orange));
        }

        .card-youth::before {
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }

        .card-studio {
            border-color: rgba(255, 107, 157, 0.3);
        }

        .card-youth {
            border-color: rgba(78, 205, 196, 0.3);
        }

        .location-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .card-studio:hover {
            border-color: var(--pink);
            background: #FFF5F7;
        }

        .card-youth:hover {
            border-color: var(--blue);
            background: #F0FFFE;
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-studio .card-title {
            color: var(--pink);
        }

        .card-youth .card-title {
            color: var(--blue);
        }

        .card-subtitle {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .card-studio .card-subtitle {
            background: rgba(255, 107, 157, 0.1);
            color: var(--pink);
        }

        .card-youth .card-subtitle {
            background: rgba(78, 205, 196, 0.1);
            color: var(--blue);
        }

        .card-stats {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            padding-top: 12px;
            border-top: 2px dashed #F0F0F0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbb;
            animation: fadeInUp 0.6s ease 0.8s both;
            position: relative;
            z-index: 1;
        }

        .footer span {
            color: var(--pink);
        }

        /* Mobile responsiveness */
        @media (max-width: 400px) {
            .logo-badge {
                font-size: 1.6rem;
                padding: 12px 28px;
            }

            .card-icon {
                font-size: 2.5rem;
            }

            .card-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- Floating decorations -->
    <div class="floating-emoji">📸</div>
    <div class="floating-emoji">🌟</div>
    <div class="floating-emoji">🎉</div>
    <div class="floating-emoji">💖</div>
    <div class="floating-emoji">✨</div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-badge">📸 Monobox</div>
            <div class="subtitle">🎉 Sistem Antrian Ceria 🎉</div>
        </div>

        <!-- Section Label -->
        <div class="section-label">✨ PILIH LOKASI ✨</div>

        <!-- Location Cards -->
        <div class="cards-wrapper">
            <!-- Studio Utama -->
            <a href="/indoor/queue" class="location-card card-studio" id="card-studio">
                <div class="card-icon">🏠</div>
                <div class="card-title">STUDIO UTAMA</div>
                <div class="card-subtitle">Indoor Studio 📷</div>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">Menunggu</span>
                        <span class="stat-value" id="studio-waiting">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Est. Waktu</span>
                        <span class="stat-value" id="studio-est">~0m</span>
                    </div>
                </div>
            </a>

            <!-- Youth Center -->
            <a href="/outdoor/queue" class="location-card card-youth" id="card-youth">
                <div class="card-icon">🌳</div>
                <div class="card-title">YOUTH CENTER</div>
                <div class="card-subtitle">Outdoor Studio 🌿</div>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">Menunggu</span>
                        <span class="stat-value" id="youth-waiting">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Est. Waktu</span>
                        <span class="stat-value" id="youth-est">~0m</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            Dibuat dengan <span>❤️</span> untuk Senyummu
        </div>
    </div>

    <script>
        const evtSource = new EventSource('/api/stream/All');

        function updateAllStats(data) {
            const studio = data['Studio Utama'];
            const youth = data['Youth Center'];

            document.getElementById('studio-waiting').textContent = studio.waiting;
            document.getElementById('studio-est').textContent = `~${studio.waiting * studio.session_duration}m`;

            document.getElementById('youth-waiting').textContent = youth.waiting;
            document.getElementById('youth-est').textContent = `~${youth.waiting * youth.session_duration}m`;
        }

        // SSE: Jalur utama
        evtSource.addEventListener('update_all_stats', (e) => {
            updateAllStats(JSON.parse(e.data));
        });

        // FALLBACK POLLING: Paksa update setiap 500ms
        setInterval(async () => {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                updateAllStats(data);
            } catch (e) { /* abaikan */ }
        }, 500);
    </script>
</body>

</html>
