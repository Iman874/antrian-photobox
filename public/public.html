<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monobox Queue Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <style>
        body {
            background-color: #FFF9F0;
            background-image: url('/bgmobilenologo.webp');
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            color: #452030;
            font-family: 'Fredoka', sans-serif;
        }

        @media (min-width: 768px) {
            body {
                background-image: url('/bgdesktop.webp');
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 157, 157, 0.3);
            border-radius: 1rem;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(214, 40, 57, 0.3);
        }

        .logo-img {
            display: block;
            width: auto;
            height: 64px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4 min-h-screen">
    <img src="/logobarumonobox-crop.png" alt="Monobox" class="logo-img">
    <h1 class="text-4xl font-bold mb-12 text-center text-glow" style="color: #D62839;">Pilih Lokasi</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
        <a href="/indoor/queue" class="glass p-8 flex flex-col items-center hover:bg-pink-50 transition-colors">
            <h2 class="text-3xl font-semibold mb-6 text-center" style="color: #452030;">STUDIO UTAMA</h2>
            <div class="mb-2 font-semibold tracking-widest text-sm" style="color: #D62839;">EST. WAKTU PANGGIL</div>
            <div id="est-Studio Utama" class="text-5xl font-bold" style="color: #D62839;">~--.--</div>
        </a>

        <a href="/outdoor/queue" class="glass p-8 flex flex-col items-center hover:bg-pink-50 transition-colors">
            <h2 class="text-3xl font-semibold mb-6 text-center" style="color: #452030;">JAMSIT</h2>
            <div class="mb-2 font-semibold tracking-widest text-sm" style="color: #D62839;">EST. WAKTU PANGGIL</div>
            <div id="est-Youth Center" class="text-5xl font-bold" style="color: #D62839;">~--.--</div>
        </a>
    </div>

    <script>
        const evtSource = new EventSource('/api/stream/All');

        function updateAllEst(data) {
            updateEst('Studio Utama', data['Studio Utama']);
            updateEst('Youth Center', data['Youth Center']);
        }

        // SSE: Jalur utama
        evtSource.addEventListener('update_all_stats', (e) => {
            updateAllEst(JSON.parse(e.data));
        });

        // FALLBACK POLLING: Cadangan update bila SSE terputus (10 detik)
        setInterval(async () => {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                updateAllEst(data);
            } catch (e) { /* abaikan */ }
        }, 10000);

        function updateEst(loc, stats) {
            const waiting = stats ? (stats.waiting || 0) : 0;
            const dur = stats ? (stats.session_duration || 5) : 5;
            const waitTimeMin = waiting * dur;

            const estTime = dayjs().add(waitTimeMin, 'minute').format('HH:mm');
            const el = document.getElementById(`est-${loc}`);
            if (el) el.innerText = `~${estTime}`;
        }
    </script>
</body>

</html>
